name: Backup format variant
description: A backup that this tool does not recognise or cannot decrypt
labels: [format]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping widen compatibility. Describe the *shape* of the
        backup, never its contents. See `docs/COMPATIBILITY.md` for exactly
        what is useful and safe to send.
  - type: textarea
    id: layout
    attributes:
      label: Directory and file naming
      description: Structure with personal values replaced, for example `<name>_appDataTar/data.tar`.
      render: text
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Metadata shape
      description: >
        Which columns identify a module, and the length and character class of the
        key material — never its value. For example "encMsgV3, 96 hex characters".
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: HiSuite and phone software versions, if known
  - type: textarea
    id: output
    attributes:
      label: Command, exit code, and redacted error
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real metadata values, backup data, or passwords.
          required: true
