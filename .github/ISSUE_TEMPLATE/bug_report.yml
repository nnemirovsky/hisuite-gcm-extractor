name: Bug report
description: Something did not work, or an error message was not clear enough
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach a real backup, `info.xml`, database, recovered file,
        device identifier, or password.** Redact anything personal. An unclear
        error message is a valid bug — please report it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command with personal paths replaced, plus the error and exit code.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `hisuite-gcm --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real backup data, passwords, or device identifiers.
          required: true
